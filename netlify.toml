[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing - redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Custom 404 page
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
