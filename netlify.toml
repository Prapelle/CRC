[build]
  command = "npm install && npm run build && cp public/_redirects dist/_redirects 2>/dev/null || echo '/*    /index.html   200' > dist/_redirects"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing - redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Custom 404 page
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
