name: One-time regenerate package lock
on:
  push:
    branches:
      - feat/supabase-shared-storage
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    if: "!contains(github.event.head_commit.message, 'Regenerate lockfile for Supabase dependency')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/supabase-shared-storage
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/one-time-regenerate-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Regenerate lockfile for Supabase dependency"
          git push origin HEAD:feat/supabase-shared-storage
